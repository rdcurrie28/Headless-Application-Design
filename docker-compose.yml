services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: insights
      POSTGRES_DB: insights
    ports: ["5432:5432"]
    volumes:
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/customer-insights;
      echo 'sample QBR' > /tmp/qbr-2026-q3.pdf;
      for c in C-1001 C-1002 C-1003 C-1004 C-1005; do mc cp /tmp/qbr-2026-q3.pdf local/customer-insights/customers/$$c/qbr-2026-q3.pdf; done
      "

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      CI_POSTGRES_DSN: postgresql://insights:insights@postgres:5432/insights
      CI_S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]

  web:
    build: ./web
    depends_on: [api]
    environment:
      API_UPSTREAM: http://api:8000
      API_KEY: ${CI_API_KEYS:-dev-key-change-me}
    ports: ["3000:8080"]
